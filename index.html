<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Empire Bet</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B00;
            --primary-gradient: linear-gradient(135deg, #FF8C00, #FF4500);
            --bg-color: #F4F7FB;
            --card-bg: #FFFFFF;
            --text-main: #1A202C;
            --text-sub: #718096;
            --shadow-soft: 0 10px 30px rgba(0,0,0,0.05);
            --shadow-glow: 0 8px 25px rgba(255, 107, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); padding-bottom: 85px; color: var(--text-main); overflow-x: hidden; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse-badge { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

        /* --- HEADER & LOGO --- */
        header { background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.04); position: sticky; top: 0; z-index: 100; }
        
        /* EMPIRE BET LOGO STYLE */
        .logo { font-size: 22px; font-weight: 900; color: #0F172A; letter-spacing: -0.5px; display: flex; align-items: center; gap: 4px;}
        .logo span { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-icon { font-size: 24px; margin-right: 2px;}
        
        .btn-header { padding: 8px 20px; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; background: var(--primary-gradient); color: #fff; box-shadow: var(--shadow-glow); transition: transform 0.2s; }
        .btn-header:active { transform: scale(0.95); }

        /* --- LOADING OVERLAY --- */
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px); z-index: 99999; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .loading-spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }

        /* --- VIEWS & CARDS --- */
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        .account-card { background: var(--card-bg); margin: 15px; padding: 20px; border-radius: 20px; box-shadow: var(--shadow-soft); position: relative; overflow: hidden; }
        .account-card::before { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: rgba(255, 107, 0, 0.05); border-radius: 50%; }
        .balance-amount { font-size: 36px; font-weight: 800; color: var(--text-main); margin-bottom: 15px; display: none; letter-spacing: -1px;}
        
        .action-buttons { display: flex; justify-content: space-between; text-align: center; font-size: 12px; color: var(--text-sub); font-weight: 500; margin-top: 15px;}
        .action-btn { flex: 1; cursor: pointer; transition: transform 0.2s; }
        .action-btn:active { transform: scale(0.9); }
        .action-icon { display: flex; justify-content: center; align-items: center; width: 50px; height: 50px; background: #F8FAFC; border-radius: 18px; margin: 0 auto 8px; font-size: 22px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid rgba(255,255,255,0.5);}

        .game-section { margin: 0 15px 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 5px;}
        .section-title { font-weight: 800; font-size: 18px; color: var(--text-main); }
        
        .game-item { background: var(--card-bg); display: flex; align-items: center; padding: 15px; border-radius: 16px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); cursor: pointer; transition: transform 0.2s; border: 1px solid #F1F5F9;}
        .game-item:active { transform: scale(0.98); }
        
        .game-icon { width: 55px; height: 55px; border-radius: 16px; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 20px; position: relative; overflow: hidden; }
        .game-icon::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to bottom, rgba(255,255,255,0.3), rgba(255,255,255,0)); }
        .icon-lucky { background: linear-gradient(135deg, #FF416C, #FF4B2B); box-shadow: 0 6px 15px rgba(255, 65, 108, 0.4); }

        /* --- MODALS & NAV --- */
        .popup-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px); z-index: 5000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .popup-box { background: #fff; width: 90%; max-width: 360px; border-radius: 24px; padding: 30px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .popup-box h3 { margin-bottom: 10px; font-size: 20px; color: var(--text-main); }
        .popup-box input { width: 100%; padding: 15px; border: 1px solid #E2E8F0; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 20px; outline: none; background: #F8FAFC;}
        .popup-btn { background: var(--primary-gradient); color: white; border: none; padding: 15px; width: 100%; border-radius: 25px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-glow); }
        .popup-btn.cancel { background: #F1F5F9; color: var(--text-sub); margin-top: 10px; box-shadow: none;}

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 15px 0 25px 0; border-top: 1px solid rgba(0,0,0,0.05); z-index: 100; }
        .nav-item { text-align: center; font-size: 11px; font-weight: 600; color: #94A3B8; cursor: pointer; transition: transform 0.2s;}
        .nav-item:active { transform: scale(0.9); }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 24px; display: block; margin-bottom: 4px; }

        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #0F172A; color: #fff; padding: 14px 28px; border-radius: 30px; font-size: 14px; font-weight: 600; z-index: 10000; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; width: max-content; max-width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2);}
        #toast.show { top: 25px; }
        #toast.error { background: #EF4444; }
        #toast.success { background: #10B981; }
    </style>
</head>
<body>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div id="loading-text" style="font-weight: 600;">Connecting to Empire Bet server...</div>
    </div>

    <div id="toast">Message</div>

    <header>
        <!-- EMPIRE BET LOGO -->
        <div class="logo">
            <span class="logo-icon">👑</span> Empire<span>Bet</span>
        </div>
        <div id="header-buttons">
            <button class="btn-header" onclick="simulateLogin()">Sign Up</button>
        </div>
    </header>

    <!-- HOME VIEW -->
    <div id="view-home" class="view active">
        <div class="account-card">
            <div id="dash-greeting" style="font-size: 14px; color: var(--text-sub); margin-bottom: 5px; font-weight: 500;">Welcome to Empire Bet, Guest</div>
            <div class="balance-amount" id="dash-balance-amt">$0.00</div>
            
            <div class="action-buttons">
                <div class="action-btn" onclick="apiDeposit()">
                    <span class="action-icon">💰</span> Deposit
                </div>
                <div class="action-btn" onclick="apiWithdraw()">
                    <span class="action-icon">💸</span> Withdraw
                </div>
                <div class="action-btn" onclick="switchView('view-history', 'nav-bets')">
                    <span class="action-icon">📋</span> Orders
                </div>
            </div>
        </div>

        <div class="game-section">
            <div class="section-header">
                <div class="section-title">Hot Lottery</div>
            </div>
            
            <div class="game-item" onclick="apiPlaceBet()">
                <div class="game-icon icon-lucky">49</div>
                <div style="flex: 1;">
                    <div style="font-weight: 700; font-size: 16px; color: var(--text-main);">Lucky 49</div>
                    <div style="font-size: 12px; color: var(--primary); font-weight: 600; margin-top:2px;">Daily at 20:30</div>
                </div>
                <div style="color: #CBD5E1; font-size: 20px;">›</div>
            </div>
        </div>
    </div>

    <!-- HISTORY VIEW -->
    <div id="view-history" class="view">
        <div style="padding: 20px; font-weight: 700; font-size: 18px; background: #fff; border-bottom: 1px solid #eee;">My Orders</div>
        <div id="history-list" style="padding: 15px;">
            <div style="text-align: center; color: var(--text-sub); padding: 40px 20px;" id="empty-history">No transactions yet.</div>
        </div>
    </div>

    <!-- WITHDRAWAL MODAL -->
    <div id="withdraw-modal" class="popup-modal">
        <div class="popup-box">
            <h3>Withdraw Funds</h3>
            <p style="font-size:13px; color:#718096; margin-bottom:15px;">Minimum withdrawal is $10.00</p>
            <input type="number" id="withdraw-amount" placeholder="Amount ($)">
            <button class="popup-btn" onclick="apiSubmitWithdrawal()">Confirm Withdrawal</button>
            <button class="popup-btn cancel" onclick="document.getElementById('withdraw-modal').style.display='none'">Cancel</button>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="switchView('view-home', 'nav-home')"><span class="nav-icon">🏠</span> Home</div>
        <div class="nav-item" id="nav-bets" onclick="switchView('view-history', 'nav-bets')"><span class="nav-icon">🎲</span> Bets</div>
    </div>

    <script>
        // --- STATE ---
        let userBalance = 0.00;
        let isLoggedIn = false;
        let transactions = [];

        // --- UI HELPERS ---
        function showToast(message, type = 'default') {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = 'show ' + type;
            if (navigator.vibrate) navigator.vibrate(50);
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function toggleLoading(show, text = "Processing...") {
            document.getElementById('loading-text').innerText = text;
            document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
        }

        function updateBalanceUI() {
            document.getElementById('dash-balance-amt').innerText = "$" + userBalance.toFixed(2);
            const headerBal = document.getElementById('header-balance');
            if (headerBal) headerBal.innerText = "$" + userBalance.toFixed(2);
        }

        function switchView(viewId, navId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if(navId) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                if(document.getElementById(navId)) document.getElementById(navId).classList.add('active');
            }
        }

        // --- AUTH ---
        function simulateLogin() {
            toggleLoading(true, "Authenticating...");
            setTimeout(() => {
                isLoggedIn = true;
                toggleLoading(false);
                showToast("Welcome to Empire Bet!", "success");
                document.getElementById('header-buttons').innerHTML = `<div style="font-weight:800; color:var(--primary); font-size:16px;" id="header-balance">$0.00</div>`;
                document.getElementById('dash-greeting').innerText = "Welcome, Player";
                document.getElementById('dash-balance-amt').style.display = 'block';
                userBalance = 15.00; // Test funds
                updateBalanceUI();
            }, 1500);
        }

        // --- API SIMULATIONS ---
        function apiDeposit() {
            if(!isLoggedIn) { simulateLogin(); return; }
            toggleLoading(true, "Sending M-Pesa Prompt...");
            setTimeout(() => {
                toggleLoading(true, "Verifying M-Pesa PIN...");
                setTimeout(() => {
                    toggleLoading(false);
                    userBalance += 20.00;
                    updateBalanceUI();
                    addTransaction("Deposit via M-Pesa", 20.00, "plus");
                    showToast("Deposit of $20 successful!", "success");
                }, 2000);
            }, 1500);
        }

        function apiWithdraw() {
            if (!isLoggedIn) { simulateLogin(); return; }
            document.getElementById('withdraw-modal').style.display = 'flex';
        }

        function apiSubmitWithdrawal() {
            const amount = parseFloat(document.getElementById('withdraw-amount').value);
            if (isNaN(amount) || amount < 10.00) { showToast("Minimum is $10.00", "error"); return; }
            if (amount > userBalance) { showToast("Insufficient balance", "error"); return; }

            document.getElementById('withdraw-modal').style.display = 'none';
            toggleLoading(true, "Processing Withdrawal...");

            setTimeout(() => {
                toggleLoading(false);
                userBalance -= amount;
                updateBalanceUI();
                addTransaction("Withdrawal to M-Pesa", amount, "minus");
                showToast(`Withdrew $${amount.toFixed(2)}`, "success");
            }, 2500);
        }

        function apiPlaceBet() {
            if(!isLoggedIn) { simulateLogin(); return; }
            toggleLoading(true, "Placing Bet...");
            setTimeout(() => {
                toggleLoading(false);
                showToast("Bet placed successfully on Lucky 49!", "success");
            }, 1500);
        }

        // --- HISTORY ---
        function addTransaction(title, amount, type) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            transactions.unshift({ title, amount, type, time: timeStr });
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if(transactions.length === 0) return;
            document.getElementById('empty-history').style.display = 'none';
            list.innerHTML = '';
            transactions.forEach(t => {
                const div = document.createElement('div');
                div.style = "background: #fff; padding: 18px; border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #F1F5F9;";
                div.innerHTML = `
                    <div>
                        <div style="font-weight: 600; font-size: 14px; color: #1A202C;">${t.title}</div>
                        <div style="font-size: 11px; color: #718096; margin-top: 4px;">Today at ${t.time}</div>
                    </div>
                    <div style="font-weight: 800; font-size: 16px; color: ${t.type === 'plus' ? '#10B981' : '#EF4444'};">
                        ${t.type === 'plus' ? '+' : '-'}$${t.amount.toFixed(2)}
                    </div>
                `;
                list.appendChild(div);
            });
        }
    </script>
</body>
</html>
